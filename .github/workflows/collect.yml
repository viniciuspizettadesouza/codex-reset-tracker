name: Collect reset events

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:          # manual trigger for testing

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collector
        id: collect
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          set +e
          node scripts/collect.mjs
          CODE=$?
          if [ $CODE -eq 2 ]; then
            echo "Collector errored (exit 2). Failing job."
            exit 2
          fi
          # exit 1 = new events written; exit 0 = nothing new
          echo "changed=$([ $CODE -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit and push new events
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resets.json
          git commit -m "chore: auto-update resets [skip ci]"
          git push
